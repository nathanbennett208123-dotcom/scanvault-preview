<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScanVault Preview</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0a0a;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
h1{font-size:2rem;margin-bottom:1rem;background:linear-gradient(135deg,#f59e0b,#ef4444);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
p{opacity:.7;max-width:400px;line-height:1.6;margin-bottom:2rem}
.btn{background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff;border:none;padding:16px 32px;border-radius:12px;font-size:1rem;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{opacity:.9}
.features{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;max-width:600px;width:100%;margin-top:2rem}
.feature{background:rgba(255,255,255,.05);padding:16px;border-radius:12px}
.feature-icon{font-size:1.5rem;margin-bottom:.5rem}
</style>
</head>
<body>
<h1>ScanVault</h1>
<p>Professional-grade OBD scanner, key programming & diagnostics for cars, trucks, and heavy machinery.</p>
<a href="https://github.com/nathanbennett208123-dotcom/scanvault-preview/releases/download/v1.0/ScanVault-offline.html" class="btn">Download App (2.6 MB)</a>
<div class="features">
<div class="feature"><div class="feature-icon">📡</div><div>Live Data</div></div>
<div class="feature"><div class="feature-icon">🔧</div><div>Diagnostics</div></div>
<div class="feature"><div class="feature-icon">🔑</div><div>Key Programming</div></div>
<div class="feature"><div class="feature-icon">🚛</div><div>Heavy Duty</div></div>
</div>
<p style="margin-top:2rem;font-size:.8rem;opacity:.5">Download and double-click the file to open — no install needed, works offline.</p>
</body>
</html>
